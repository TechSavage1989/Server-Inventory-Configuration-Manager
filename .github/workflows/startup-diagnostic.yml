name: Synthetic startup diagnostic (no inventory)
on:
  push:
    branches: [diagnostic/startup-stackoverflow-3210]
permissions:
  contents: read
jobs:
  startup-self-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        mode: [startup, wrapper]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run exact published startup self-tests in an isolated PowerShell 5.1 process
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory build/startup-diagnostic -Force | Out-Null
          $stdout=Join-Path $PWD 'build/startup-diagnostic/stdout.txt'
          $stderr=Join-Path $PWD 'build/startup-diagnostic/stderr.txt'
          $probe=Join-Path $PWD 'scripts/Test-StartupSelfTests.ps1'
          $collector=Join-Path $PWD 'src/app/Export-ServerInventory.ps1'
          $arguments='-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$probe+'" -CollectorPath "'+$collector+'"'
          if('${{ matrix.mode }}' -eq 'wrapper') { $arguments+=' -WrapperProbe -WrapperResultPath "'+(Join-Path $PWD 'build/startup-diagnostic/wrapper-result.json')+'"' }
          $startInfo=New-Object System.Diagnostics.ProcessStartInfo
          $startInfo.FileName="$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $startInfo.Arguments=$arguments
          $startInfo.UseShellExecute=$false
          $startInfo.RedirectStandardOutput=$true
          $startInfo.RedirectStandardError=$true
          $child=New-Object System.Diagnostics.Process
          $child.StartInfo=$startInfo
          [void]$child.Start()
          $outTask=$child.StandardOutput.ReadToEndAsync()
          $errTask=$child.StandardError.ReadToEndAsync()
          $completed=$child.WaitForExit(60000)
          if(-not $completed){ $child.Kill(); $child.WaitForExit() }
          $child.WaitForExit()
          $exitCode=$child.ExitCode
          [IO.File]::WriteAllText($stdout,$outTask.Result)
          [IO.File]::WriteAllText($stderr,$errTask.Result)
          Get-Content $stdout
          Get-Content $stderr
          [pscustomobject]@{Completed=$completed;ExitCode=$exitCode;HostPowerShell=$PSVersionTable.PSVersion.ToString();OS=[Environment]::OSVersion.VersionString;SourceCommit='${{ github.sha }}'} | ConvertTo-Json | Set-Content build/startup-diagnostic/result.json -Encoding UTF8
          if(-not $completed){throw 'Synthetic startup probe timed out.'}
          if('${{ matrix.mode }}' -eq 'wrapper') {
            if($exitCode -ne 1){throw ('Expected wrapper barrier exit 1, got '+$exitCode)}
            $result=Get-Content build/startup-diagnostic/wrapper-result.json -Raw | ConvertFrom-Json
            if($result.Status -ne 'Failed' -or $result.Message -ne 'SYNTHETIC_INVENTORY_BARRIER'){throw 'Wrapper did not report the expected first-inventory barrier.'}
            Write-Host 'PASS exact wrapper/collector reached controlled first-query barrier; no inventory query executed.'
          } elseif($exitCode -ne 0){throw ('Synthetic startup probe exited: '+$exitCode)}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-diagnostic-${{ matrix.os }}-${{ matrix.mode }}
          path: build/startup-diagnostic/
          retention-days: 7
  standalone-bundle:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone probe, checksum rejection and bounded timeout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $bundle=Join-Path $PWD 'scripts/diagnostics/startup-probe'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -File "$bundle/Run-Diagnostic.ps1"
          if($LASTEXITCODE -ne 0){throw 'Standalone bundle failed.'}
          $report=Get-ChildItem "$bundle/Startup-Diagnostic-*.txt" | Select-Object -First 1
          if((Get-Content $report.FullName -Raw) -notmatch 'PASS all synthetic startup tests'){throw 'Missing probe success marker.'}
          Get-Content $report.FullName
          $negative=Join-Path $env:RUNNER_TEMP 'negative-checksum'
          Copy-Item $bundle $negative -Recurse
          Add-Content "$negative/Startup-Probe.ps1" '# negative checksum fixture'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -File "$negative/Run-Diagnostic.ps1"
          if($LASTEXITCODE -ne 2){throw 'Modified payload was not rejected.'}
          $timeout=Join-Path $env:RUNNER_TEMP 'negative-timeout'
          Copy-Item $bundle $timeout -Recurse
          Set-Content "$timeout/Startup-Probe.ps1" 'Start-Sleep -Seconds 30' -Encoding UTF8
          $hash=(Get-FileHash "$timeout/Startup-Probe.ps1" -Algorithm SHA256).Hash
          $runner=[IO.File]::ReadAllText("$timeout/Run-Diagnostic.ps1").Replace('BFFFA7189BAB9DC4FB99F1DB3F375E5616F708CF2C6B54D885A5865218F81502',$hash).Replace('WaitForExit(60000)','WaitForExit(1000)')
          [IO.File]::WriteAllText("$timeout/Run-Diagnostic.ps1",$runner)
          $watch=[Diagnostics.Stopwatch]::StartNew()
          & powershell.exe -NoLogo -NoProfile -NonInteractive -File "$timeout/Run-Diagnostic.ps1"
          if($LASTEXITCODE -ne 3 -or $watch.Elapsed.TotalSeconds -gt 15){throw 'Bounded timeout control failed.'}
          Write-Host 'PASS bundle, rejected altered payload, and terminated only the owned timed-out child.'
