name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve source version
        id: version
        shell: powershell
        run: |
          $main=Get-Content .\main.go -Raw
          $version=[regex]::Match($main,'appVersion\s*=\s*"(?<v>\d+\.\d+\.\d+)"').Groups['v'].Value
          if(-not $version){throw 'Missing source version'}
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify SVG-derived icon assets
        shell: powershell
        run: |
          npm ci --prefix .\scripts\icon-tools --no-audit --no-fund
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\build_icons.cjs --check
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Verify original executable assets
        shell: powershell
        run: |
          python .\scripts\embed_report_renderer.py --check
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python .\scripts\verify_baseline.py
      - name: Generate real HTML and Word report fixtures
        shell: powershell
        run: .\scripts\Test-Report.ps1
      - name: Compile active icon and Windows metadata resources
        shell: powershell
        run: python .\scripts\build_resources.py --version '${{ steps.version.outputs.version }}'
      - name: Validate source
        shell: powershell
        run: .\scripts\Test-Source.ps1
      - name: Build portable Windows executable
        shell: powershell
        run: |
          New-Item -ItemType Directory .\build -Force | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o .\build\Server-Inventory-Configuration-Manager.exe .
      - name: Validate executable
        shell: powershell
        run: .\scripts\Test-Binary.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}'
      - name: Run updater tests and negative controls
        shell: powershell
        run: |
          go test -v ./... 2>&1 | Tee-Object .\build\go-test-results.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Vet Go source
        shell: powershell
        run: go vet ./...
      - name: Test renderer shutdown and modal-error negative control
        shell: powershell
        run: |
          npm install --prefix .\build\ui-tools playwright@1.58.2
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $env:NODE_PATH=(Resolve-Path .\build\ui-tools\node_modules).Path
          node .\scripts\test_ui_shutdown.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_icon_render.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_report.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Test native install and visible healthy start
        shell: powershell
        run: .\scripts\Test-UpdateInstall.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}'
      - name: Build release manifest
        shell: powershell
        run: .\scripts\Build-ReleaseManifest.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}' -OutputDirectory .\dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            build/go-test-results.txt
            build/ui-shutdown-regression.json
            build/icon-render-regression.json
            build/icon-header-validation.png
            build/shell-icon-*.png
            build/report-validation/
            dist/
