name: CI
on:
  push:
    branches: [main, fix/collection-responsiveness-3211]
  pull_request:
  # Run the full suite on any branch from the Actions tab (or the API), for a
  # change into release/next that needs the Windows checks before the batch.
  workflow_dispatch:
permissions:
  contents: read
# Batched merges (AGENTS.md, "Batched merges"): fixes are pull requests into
# release/next, which get the quick Linux checks only; the one pull request
# from release/next to main runs everything. A newer push to the same pull
# request or branch cancels the run it replaces; pushes to main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  quick:
    # Fast checks for every pull request, including those into release/next:
    # provenance and layout, gofmt, vet and a Windows cross-build, and the
    # platform-independent Go tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Layout, report renderer and baseline provenance
        run: |
          python3 scripts/check_layout.py
          python3 scripts/embed_report_renderer.py --check
          python3 scripts/verify_baseline.py
      - name: Go format, vet and Windows cross-build
        run: |
          go mod download
          unformatted=$(gofmt -l src/app)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o build/check.exe ./src/app
      - name: Platform-independent Go tests
        run: go test -count=1 ./...
  ui:
    # The workspace and report logic checks against the production HTML and
    # CSP, in Linux Chromium (the Windows job repeats them in Edge).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workspace checks in Chromium
        run: |
          npm install --prefix build/ui-tools playwright@1.58.2
          npx --prefix build/ui-tools playwright install --with-deps chromium
          export NODE_PATH=$(realpath build/ui-tools/node_modules)
          chrome=$(node -e "console.log(require('playwright').chromium.executablePath())")
          node scripts/test_workspace.cjs --executable "$chrome"
          node scripts/test_report_copy_logic.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-validation-linux
          path: build/workspace-validation/
          if-no-files-found: ignore
  windows:
    # Skipped for pull requests into release/next; the batch pull request runs it.
    if: ${{ !startsWith(github.base_ref, 'release/') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve source version
        id: version
        shell: powershell
        run: |
          $main=Get-Content .\src\app\main.go -Raw
          $version=[regex]::Match($main,'appVersion\s*=\s*"(?<v>\d+\.\d+\.\d+)"').Groups['v'].Value
          if(-not $version){throw 'Missing source version'}
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify SVG-derived icon assets
        shell: powershell
        run: |
          npm ci --prefix .\scripts\icon-tools --no-audit --no-fund
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python .\tests\test_icon_source.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\build_icons.cjs --check
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Verify original executable assets
        shell: powershell
        run: |
          python .\tests\test_report_encoding.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python .\scripts\embed_report_renderer.py --check
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python .\scripts\verify_baseline.py
      - name: Test startup helper cycles without inventory
        shell: powershell
        run: |
          New-Item -ItemType Directory build/startup-helper-validation -Force | Out-Null
          .\scripts\Test-StartupHelpers.ps1 2>&1 | Tee-Object build/startup-helper-validation/checks.txt
      - name: Validate standalone candidate startup probe
        shell: powershell
        run: |
          .\scripts\Build-StartupComparisonProbe.ps1
          .\build\startup-comparison\Run-Comparison.ps1
          $log=Get-ChildItem build/startup-comparison/Startup-Comparison-*.txt | Select-Object -Last 1
          $text=Get-Content $log.FullName -Raw
          if($text -notmatch 'PASS ALL CANDIDATE STARTUP TESTS' -or $text -notmatch 'Child exit code: 0' -or $text -notmatch 'Finished within timeout: True'){throw 'Standalone candidate probe failed'}
          Compress-Archive build/startup-comparison/* build/ServerInventory-3.2.11-Startup-Candidate-Diagnostic.zip
      - name: Test bounded recursive ACL workers with synthetic fixtures
        shell: powershell
        run: .\scripts\Test-AclExports.ps1
      - name: Generate real HTML and Word report fixtures
        shell: powershell
        run: .\scripts\Test-Report.ps1
      - name: Test real saved report values without collection
        shell: powershell
        run: .\scripts\Test-ReportValues.ps1
      - name: Verify optimized report output parity without collection
        shell: powershell
        run: .\scripts\Test-ReportPerformance.ps1
      - name: Compile active icon and Windows metadata resources
        shell: powershell
        run: python .\scripts\build_resources.py --version '${{ steps.version.outputs.version }}'
      - name: Validate source
        shell: powershell
        run: .\scripts\Test-Source.ps1
      - name: Build portable Windows executable
        shell: powershell
        run: |
          New-Item -ItemType Directory .\build -Force | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o .\build\Server-Inventory-Configuration-Manager.exe ./src/app
      - name: Verify extracted source archive rebuild
        shell: powershell
        run: |
          git archive --format=zip --output=build/source-validation.zip HEAD
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Expand-Archive build/source-validation.zip build/source-validation -Force
          Push-Location build/source-validation
          try {
            python scripts/check_layout.py
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            python scripts/verify_baseline.py
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            python scripts/embed_report_renderer.py --check
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            python scripts/build_resources.py --version '${{ steps.version.outputs.version }}'
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            New-Item -ItemType Directory build -Force | Out-Null
            go build -trimpath -ldflags "-s -w -H=windowsgui" -o build/Server-Inventory-Configuration-Manager.exe ./src/app
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            ./scripts/Test-Binary.ps1 -ExecutablePath build/Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}'
          } finally { Pop-Location }
      - name: Validate executable
        shell: powershell
        run: .\scripts\Test-Binary.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}'
      - name: Run updater tests and negative controls
        shell: powershell
        run: |
          # Fetch test-only modules first: their "go: downloading" lines go to
          # stderr, which 2>&1 turns into a terminating PowerShell error.
          go mod download
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          go test -v ./... 2>&1 | Tee-Object .\build\go-test-results.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Vet Go source
        shell: powershell
        run: go vet ./...
      - name: Test renderer shutdown and modal-error negative control
        shell: powershell
        run: |
          npm install --prefix .\build\ui-tools playwright@1.58.2
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $env:NODE_PATH=(Resolve-Path .\build\ui-tools\node_modules).Path
          node .\scripts\test_ui_shutdown.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_icon_render.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_workspace.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_report.cjs
          if ($LASTEXITCODE -ne 0) { throw "Report browser validation failed" }
          node .\scripts\test_report_copy_logic.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_report_copy.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $env:SIMM_REPORT_SAMPLES=(New-Item -ItemType Directory -Force .\build\vm-report-samples).FullName
          go test -count=1 -run TestWriteSampleReports ./src/app
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_vm_report.cjs $env:SIMM_REPORT_SAMPLES
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Test native install and visible healthy start
        shell: powershell
        run: .\scripts\Test-UpdateInstall.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}'
      - name: Build release manifest
        shell: powershell
        run: .\scripts\Build-ReleaseManifest.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}' -OutputDirectory .\dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            build/go-test-results.txt
            build/ui-shutdown-regression.json
            build/icon-render-regression.json
            build/icon-header-validation.png
            build/shell-icon-*.png
            build/report-validation/
            build/report-values/
            build/report-performance/parity/
            build/workspace-validation/
            build/startup-helper-validation/
            build/startup-comparison/
            build/ServerInventory-3.2.11-Startup-Candidate-Diagnostic.zip
            build/acl-validation/
            dist/

  disks:
    # Disk converter cross-checks: QEMU writes every input variant the readers
    # must understand, and qemu-img checks and compares every output format.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Install qemu-img
        run: sudo apt-get update && sudo apt-get install -y qemu-utils
      - name: Disk format and converter tests against QEMU
        run: |
          go mod download
          go test -v -count=1 -run 'Convert|Probe|QEMU|ReadsEvery|ReadsQEMU|Copy|VHDX|VMDK' ./src/app 2>&1 | tee build-disk-tests.txt
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q -- '--- SKIP' build-disk-tests.txt; then echo 'QEMU tests were skipped'; exit 1; fi

  linuxagent:
    # The Linux replication agent on a real kernel: LVM snapshots of a loop
    # disk, a replication job with cutover, and the systemd install.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Install LVM and file system tools
        run: sudo apt-get update && sudo apt-get install -y lvm2 e2fsprogs fdisk
      - name: Build the Linux agent and its tests
        run: |
          go mod download
          version=$(grep -oP 'appVersion\s*=\s*"\K[0-9.]+' src/app/main.go)
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.linuxAgentVersion=$version" -o build/simm-agent-linux-amd64 ./src/app
          test "$(./build/simm-agent-linux-amd64 --version)" = "$version"
          go test -c -o build/linux.test ./src/app
      - name: Linux agent tests as root
        run: |
          cd src/app
          sudo ../../build/linux.test -test.v -test.count=1 -test.run 'Linux' 2>&1 | tee ../../build/linux-agent-tests.txt
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q -- '--- SKIP' ../../build/linux-agent-tests.txt; then echo 'Linux agent tests were skipped'; exit 1; fi

  restore:
    # Skipped for pull requests into release/next; the batch pull request runs it.
    if: ${{ !startsWith(github.base_ref, 'release/') }}
    # Real restore round trips: installs DHCP, DNS, IIS, NPS and Print Server on
    # the disposable runner, exports synthetic configuration the way the
    # collector does, changes it, and restores it with the embedded engine.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore engine round trips
        shell: powershell
        run: .\scripts\Test-Restore.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-validation
          path: |
            build/restore-validation/*.log
            build/restore-validation/checks.txt
            build/restore-validation/scan.json
  migration:
    # Skipped for pull requests into release/next; the batch pull request runs it.
    if: ${{ !startsWith(github.base_ref, 'release/') }}
    # Real file share migration round trip on the disposable runner (it is both
    # the old and the new server): discover, check, copy, copy again, cutover,
    # old-share read-only and undo.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: File share migration round trip
        shell: powershell
        run: .\scripts\Test-Migration.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-validation
          path: |
            build/migration-validation/*.log
            build/migration-validation/*.json
            build/migration-validation/checks.txt
  vmguest:
    # Skipped for pull requests into release/next; the batch pull request runs it.
    if: ${{ !startsWith(github.base_ref, 'release/') }}
    # Real guest fix-up round trip: a loopback adapter gets static settings,
    # they are recorded, cleared, put back and undone with the embedded engine.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: VM guest pre-flight and fix-up round trip
        shell: powershell
        run: .\scripts\Test-VmGuest.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vmguest-validation
          path: |
            build/vmguest-validation/*.log
            build/vmguest-validation/*.json
            build/vmguest-validation/checks.txt
