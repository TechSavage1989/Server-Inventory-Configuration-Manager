name: Publish Release
# Stable releases publish from main; signed test prereleases (X.Y.Z-test.N)
# publish from the long-lived test branch (AGENTS rule 61). Both are signed the
# same way; only Test-channel installs are ever offered a test build.
on:
  push:
    branches: [main, test]
    paths: [release/VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: New version to publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: executable-release
  cancel-in-progress: false
# Azure Artifact Signing (the same account and certificate profile as Network
# Toolkit). These names are not secret; the sign-in identifiers are the
# AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID secrets.
# See docs/CODE_SIGNING.md.
env:
  SIGN_ENDPOINT: https://eus.codesigning.azure.net
  SIGN_ACCOUNT: networktoolkit-signing
  SIGN_PROFILE: jpaull-codesign
  SIGN_TOOL_VERSION: '0.9.1-beta.26552.4'
  SIGN_TIMESTAMP_URL: http://timestamp.acs.microsoft.com
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    # The "release" environment gives the OIDC token the subject
    # repo:<owner>/<repo>:environment:release, which the Entra federated
    # credential matches exactly.
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      test: ${{ steps.version.outputs.test }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve new release version
        id: version
        shell: powershell
        run: |
          $version='${{ inputs.version }}'
          if(-not $version){$version=(Get-Content .\release\VERSION -Raw).Trim()}
          $isTest=$version -match '^\d+\.\d+\.\d+-test\.[1-9]\d*$'
          if(-not $isTest -and $version -notmatch '^\d+\.\d+\.\d+$'){throw 'Invalid release version'}
          # A test build publishes only from the test branch and a stable release
          # only from main, so neither channel can publish the other's code.
          $branch='${{ github.ref_name }}'
          if($isTest -and $branch -ne 'test'){throw "Test builds publish only from the test branch, not $branch"}
          if(-not $isTest -and $branch -ne 'main'){throw "Stable releases publish only from main, not $branch"}
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "test=$($isTest.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $tag="v$version"
          if(git tag --list $tag){throw 'Existing tags are never overwritten'}
          $releases=@(gh release list --limit 100 --json tagName|ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Release lookup failed'}
          if(@($releases|Where-Object{$_.tagName -eq $tag}).Count){throw 'Existing releases are never overwritten'}
      - name: Verify SVG-derived icon assets
        shell: powershell
        run: |
          npm ci --prefix .\scripts\icon-tools --no-audit --no-fund
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python .\tests\test_icon_source.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\build_icons.cjs --check
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Verify original assets
        shell: powershell
        run: |
          python .\tests\test_report_encoding.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python .\scripts\embed_report_renderer.py --check
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python .\scripts\verify_baseline.py
      - name: Test startup helpers and bounded ACL exports using synthetic data
        shell: powershell
        run: |
          .\scripts\Test-StartupHelpers.ps1
          .\scripts\Test-AclExports.ps1
      - name: Generate real HTML and Word report fixtures
        shell: powershell
        run: .\scripts\Test-Report.ps1
      - name: Test real saved report values without collection
        shell: powershell
        run: .\scripts\Test-ReportValues.ps1
      - name: Verify optimized report output parity without collection
        shell: powershell
        run: .\scripts\Test-ReportPerformance.ps1
      - name: Compile Windows resources
        shell: powershell
        run: python .\scripts\build_resources.py --version '${{ steps.version.outputs.version }}'
      - name: Verify exact source version
        shell: powershell
        run: .\scripts\Test-Source.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}'
      - name: Decide whether this release is signed
        id: signing
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $set=@($env:AZURE_CLIENT_ID,$env:AZURE_TENANT_ID,$env:AZURE_SUBSCRIPTION_ID|Where-Object{$_})
          if($set.Count -eq 3){"enabled=true"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8;exit 0}
          throw 'Code signing is required: set AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID (docs/CODE_SIGNING.md). Releases are never published unsigned.'
      - name: Install the Azure Artifact Signing client
        if: steps.signing.outputs.enabled == 'true'
        shell: powershell
        run: |
          dotnet tool install --global sign --version $env:SIGN_TOOL_VERSION
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Sign in to Azure with OIDC (no stored password)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the embedded PowerShell scripts before they are compiled in
        if: steps.signing.outputs.enabled == 'true'
        shell: powershell
        run: |
          # Every script the application writes to disk and runs, except the
          # baseline-protected collector and its wrapper, whose exact bytes are
          # pinned (docs/verification). Signing appends a signature block.
          $names='Restore-ServerConfiguration.ps1','Migrate-FileShares.ps1','Invoke-ShareMigrationRemote.ps1','Migrate-VmGuest.ps1','Build-ReceiverMedia.ps1','Move-HyperVVM.ps1','Read-HyperVHost.ps1','Repair-ConvertedDisk.ps1','Connect-HyperVTarget.ps1','Invoke-GuestRemote.ps1','Build-HyperVHost.ps1','Test-RolePreflight.ps1','Connect-HyperVConsole.ps1','Read-ScreenText.ps1','Export-MigrationBundle.ps1'
          $files=@($names|ForEach-Object{(Resolve-Path (Join-Path .\src\app $_)).Path})
          sign code artifact-signing --artifact-signing-endpoint $env:SIGN_ENDPOINT --artifact-signing-account $env:SIGN_ACCOUNT --artifact-signing-certificate-profile $env:SIGN_PROFILE --azure-credential-type azure-cli --timestamp-url $env:SIGN_TIMESTAMP_URL --timestamp-digest SHA256 --file-digest SHA256 --description 'Server Inventory and Migration Manager' --description-url 'https://github.com/${{ github.repository }}' @files
          if($LASTEXITCODE -ne 0){throw 'Script signing failed'}
          foreach($file in $files){
            $signature=Get-AuthenticodeSignature -FilePath $file
            if($signature.Status -ne 'Valid'){throw "$file is not validly signed: $($signature.Status) $($signature.StatusMessage)"}
            if(-not $signature.TimeStamperCertificate){throw "$file has no timestamp"}
          }
      - name: Build stable executable
        shell: powershell
        run: |
          New-Item -ItemType Directory .\build -Force|Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o .\build\Server-Inventory-Configuration-Manager.exe ./src/app
      - name: Sign the executable before validation and checksums
        if: steps.signing.outputs.enabled == 'true'
        shell: powershell
        run: |
          $exe=(Resolve-Path .\build\Server-Inventory-Configuration-Manager.exe).Path
          sign code artifact-signing --artifact-signing-endpoint $env:SIGN_ENDPOINT --artifact-signing-account $env:SIGN_ACCOUNT --artifact-signing-certificate-profile $env:SIGN_PROFILE --azure-credential-type azure-cli --timestamp-url $env:SIGN_TIMESTAMP_URL --timestamp-digest SHA256 --file-digest SHA256 --description 'Server Inventory and Migration Manager' --description-url 'https://github.com/${{ github.repository }}' $exe
          if($LASTEXITCODE -ne 0){throw 'Code signing failed'}
          $signature=Get-AuthenticodeSignature -FilePath $exe
          if($signature.Status -ne 'Valid'){throw "Executable signature is not valid: $($signature.Status) $($signature.StatusMessage)"}
          if(-not $signature.TimeStamperCertificate){throw 'Executable signature has no timestamp'}
          Write-Output "Signed by: $($signature.SignerCertificate.Subject)"
          Write-Output "Timestamped by: $($signature.TimeStamperCertificate.Subject)"
      - name: Sign out of Azure
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: powershell
        run: az logout; az account clear; exit 0
      - name: Validate executable
        shell: powershell
        run: .\scripts\Test-Binary.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}'
      - name: Test updater
        shell: powershell
        run: |
          go mod download
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          go test -v ./... 2>&1 | Tee-Object .\build\go-test-results.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Vet Go source
        shell: powershell
        run: go vet ./...
      - name: Test renderer shutdown and modal-error negative control
        shell: powershell
        run: |
          npm install --prefix .\build\ui-tools playwright@1.58.2
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $env:NODE_PATH=(Resolve-Path .\build\ui-tools\node_modules).Path
          node .\scripts\test_ui_shutdown.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_icon_render.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_workspace.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_report.cjs
          if ($LASTEXITCODE -ne 0) { throw "Report browser validation failed" }
          node .\scripts\test_report_copy_logic.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node .\scripts\test_report_copy.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Test native replacement and visible health confirmation
        shell: powershell
        run: .\scripts\Test-UpdateInstall.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}'
      - name: Build release assets
        shell: powershell
        run: .\scripts\Build-ReleaseManifest.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}' -OutputDirectory .\dist
      - name: Build the Linux replication agent
        shell: powershell
        run: |
          $version='${{ steps.version.outputs.version }}'
          $env:GOOS='linux';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags "-s -w -X main.linuxAgentVersion=$version" -o .\dist\simm-agent-linux-amd64 ./src/app
          if($LASTEXITCODE -ne 0){throw 'Linux agent build failed'}
          Remove-Item Env:GOOS,Env:GOARCH,Env:CGO_ENABLED
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path .\dist\simm-agent-linux-amd64))
          if($bytes.Length -lt 1MB -or $bytes[0] -ne 0x7F -or $bytes[1] -ne 0x45 -or $bytes[2] -ne 0x4C -or $bytes[3] -ne 0x46){throw 'The Linux agent is not an ELF executable'}
          $hash=(Get-FileHash .\dist\simm-agent-linux-amd64 -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path .\dist) 'simm-agent-linux-amd64.sha256.txt'),"$hash  simm-agent-linux-amd64`n",(New-Object Text.UTF8Encoding($false)))
      - name: Publish complete new release
        shell: powershell
        run: |
          $version='${{ steps.version.outputs.version }}';$tag="v$version"
          $title="Server Inventory and Migration Manager $version";$pre=@()
          if('${{ steps.version.outputs.test }}' -eq 'true'){$title+=' (test build)';$pre=@('--prerelease')}
          gh release create $tag .\dist\Server-Inventory-Configuration-Manager.exe .\dist\Server-Inventory-Configuration-Manager.exe.sha256.txt .\dist\update-manifest.json .\dist\Server-Inventory-Configuration-Manager.svg .\dist\Server-Inventory-Configuration-Manager.svg.sha256.txt .\dist\Server-Inventory-Configuration-Manager-Illustrator.svg .\dist\Server-Inventory-Configuration-Manager-Illustrator.svg.sha256.txt .\dist\Report-Preview.png .\dist\Report-Preview.png.sha256.txt .\dist\Application-Preview.png .\dist\Application-Preview.png.sha256.txt .\dist\simm-agent-linux-amd64 .\dist\simm-agent-linux-amd64.sha256.txt .\build\go-test-results.txt --draft --target '${{ github.sha }}' --title $title @pre --notes-file ".\docs\release-notes\$version.md"
          if($LASTEXITCODE -ne 0){throw 'Release create failed'}
          if('${{ steps.version.outputs.test }}' -eq 'true'){
            # A prerelease never becomes GitHub's latest release, so the stable
            # feed (releases/latest) keeps naming the newest stable build.
            gh release edit $tag --draft=false --prerelease --latest=false
          }else{
            gh release edit $tag --draft=false --latest
          }
          if($LASTEXITCODE -ne 0){throw 'Release publish failed'}
      - name: Verify public feed and downloads
        shell: powershell
        run: .\scripts\Verify-PublicRelease.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: |
            build/go-test-results.txt
            build/ui-shutdown-regression.json
            build/icon-render-regression.json
            build/icon-header-validation.png
            build/shell-icon-*.png
            build/report-validation/
            build/report-values/
            build/report-performance/parity/
            build/workspace-validation/
  published-upgrade:
    needs: publish
    # The published-upgrade check starts from the previous stable release; a
    # test build is checked by the Test-channel installs that opt in to it.
    if: needs.publish.outputs.test != 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        shell: powershell
        run: npm install --prefix .\build\ui-tools playwright@1.58.2
      - name: Exercise real published previous-to-new update
        shell: powershell
        run: |
          $env:NODE_PATH=(Resolve-Path .\build\ui-tools\node_modules).Path
          node .\scripts\test_published_upgrade.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-upgrade-validation
          path: build/published-upgrade-*
