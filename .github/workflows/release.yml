name: Publish Release

on:
  push:
    branches: [main]
    paths:
      - release/VERSION
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Resolve release version
        id: version
        shell: powershell
        run: |
          $manualVersion='${{ inputs.version }}'
          if([string]::IsNullOrWhiteSpace($manualVersion)){$version=(Get-Content .\release\VERSION -Raw).Trim()}else{$version=$manualVersion.Trim()}
          if($version -notmatch '^\d+\.\d+\.\d+$'){throw "Invalid release version: $version"}
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate embedded assets
        shell: powershell
        run: |
          python .\scripts\generate_assets.py --output-root .
          .\scripts\Extract-Collector.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Validate exact release source
        shell: powershell
        run: .\scripts\Test-Source.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}'

      - name: Refuse an existing release
        shell: powershell
        run: |
          $tag='v${{ steps.version.outputs.version }}'
          $releases=@(gh release list --limit 100 --json tagName | ConvertFrom-Json)
          if(@($releases|Where-Object{$_.tagName -eq $tag}).Count -gt 0){throw "Release $tag already exists. Published releases are never overwritten."}

      - name: Run Go tests
        shell: powershell
        run: go test ./...
      - name: Vet Go source
        shell: powershell
        run: go vet ./...

      - name: Build release executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\build -Force | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o .\build\Server-Inventory-Configuration-Manager.raw.exe .
          python .\scripts\embed_icon.py --input .\build\Server-Inventory-Configuration-Manager.raw.exe --output .\build\Server-Inventory-Configuration-Manager.exe --icon .\server_inventory.ico

      - name: Validate release executable
        shell: powershell
        run: .\scripts\Test-Binary.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}'

      - name: Test actual update helper path
        shell: powershell
        run: .\scripts\Test-UpdateInstall.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}'

      - name: Build release assets
        shell: powershell
        run: .\scripts\Build-ReleaseManifest.ps1 -ExecutablePath .\build\Server-Inventory-Configuration-Manager.exe -ExpectedVersion '${{ steps.version.outputs.version }}' -OutputDirectory .\dist

      - name: Publish GitHub release
        shell: powershell
        run: |
          $version='${{ steps.version.outputs.version }}'
          $tag="v$version"
          $notes=".\release-notes\$version.md"
          if(-not(Test-Path $notes)){throw "Release notes not found: $notes"}
          gh release create $tag .\dist\Server-Inventory-Configuration-Manager.exe .\dist\Server-Inventory-Configuration-Manager.exe.sha256.txt .\dist\update-manifest.json --target "${{ github.sha }}" --title "Server Inventory Configuration Manager $version" --notes-file $notes
          if($LASTEXITCODE -ne 0){throw "GitHub release creation failed with exit code $LASTEXITCODE."}

      - name: Verify public updater feed and release assets
        shell: powershell
        run: .\scripts\Verify-PublicRelease.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}'